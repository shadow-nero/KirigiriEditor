name: Build Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Restore
      run: dotnet restore KiriFont.sln

    # TESTES
    - name: Run Tests
      run: dotnet test KiriAppTest/KiriAppTest.csproj --configuration Release

    # BUILD GUI x64
    - name: Publish GUI x64
      run: dotnet publish KiriFontGUI/KiriFontGUI.csproj -c Release -r win-x64 --self-contained true -o publish/gui-x64

    # BUILD GUI x86
    - name: Publish GUI x86
      run: dotnet publish KiriFontGUI/KiriFontGUI.csproj -c Release -r win-x86 --self-contained true -o publish/gui-x86

    # BUILD CLI x64
    - name: Publish CLI x64
      run: dotnet publish KiriFontCLI/KiriFontCLI.csproj -c Release -r win-x64 --self-contained true -o publish/cli-x64

    # BUILD CLI x86
    - name: Publish CLI x86
      run: dotnet publish KiriFontCLI/KiriFontCLI.csproj -c Release -r win-x86 --self-contained true -o publish/cli-x86

    # BUILD DLL
    - name: Build Library
      run: dotnet build KirigiriLib/KirigiriLib.csproj -c Release

    # COPY DLL
    - name: Copy DLL
      run: |
        mkdir publish/lib
        copy KirigiriLib/bin/Release/net10.0/KirigiriLib.dll publish/lib/

    # ZIP
    - name: Create ZIPs
      run: |
        Compress-Archive -Path publish/gui-x64/* -DestinationPath KiriFontGUI-x64.zip
        Compress-Archive -Path publish/gui-x86/* -DestinationPath KiriFontGUI-x86.zip
        Compress-Archive -Path publish/cli-x64/* -DestinationPath KiriFontCLI-x64.zip
        Compress-Archive -Path publish/cli-x86/* -DestinationPath KiriFontCLI-x86.zip
        Compress-Archive -Path publish/lib/* -DestinationPath KirigiriLib.zip

    # RELEASE
    - name: Create Release
      uses: softprops/action-gh-release@v2
      with:
        files: |
          KiriFontGUI-x64.zip
          KiriFontGUI-x86.zip
          KiriFontCLI-x64.zip
          KiriFontCLI-x86.zip
          KirigiriLib.zip# refer to https://github.com/microsoft/github-actions-for-desktop-apps

name: .NET Core Desktop

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:

  build:

    strategy:
      matrix:
        configuration: [Debug, Release]

    runs-on: windows-latest  # For a list of available runner types, refer to
                             # https://help.github.com/en/actions/reference/workflow-syntax-for-github-actions#jobsjob_idruns-on

    env:
      Solution_Name: your-solution-name                         # Replace with your solution name, i.e. MyWpfApp.sln.
      Test_Project_Path: your-test-project-path                 # Replace with the path to your test project, i.e. MyWpfApp.Tests\MyWpfApp.Tests.csproj.
      Wap_Project_Directory: your-wap-project-directory-name    # Replace with the Wap project directory relative to the solution, i.e. MyWpfApp.Package.
      Wap_Project_Path: your-wap-project-path                   # Replace with the path to your Wap project, i.e. MyWpf.App.Package\MyWpfApp.Package.wapproj.

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    # Install the .NET Core workload
    - name: Install .NET Core
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x

    # Add  MSBuild to the PATH: https://github.com/microsoft/setup-msbuild
    - name: Setup MSBuild.exe
      uses: microsoft/setup-msbuild@v2

    # Execute all unit tests in the solution
    - name: Execute unit tests
      run: dotnet test

    # Restore the application to populate the obj folder with RuntimeIdentifiers
    - name: Restore the application
      run: msbuild $env:Solution_Name /t:Restore /p:Configuration=$env:Configuration
      env:
        Configuration: ${{ matrix.configuration }}

    # Decode the base 64 encoded pfx and save the Signing_Certificate
    - name: Decode the pfx
      run: |
        $pfx_cert_byte = [System.Convert]::FromBase64String("${{ secrets.Base64_Encoded_Pfx }}")
        $certificatePath = Join-Path -Path $env:Wap_Project_Directory -ChildPath GitHubActionsWorkflow.pfx
        [IO.File]::WriteAllBytes("$certificatePath", $pfx_cert_byte)

    # Create the app package by building and packaging the Windows Application Packaging project
    - name: Create the app package
      run: msbuild $env:Wap_Project_Path /p:Configuration=$env:Configuration /p:UapAppxPackageBuildMode=$env:Appx_Package_Build_Mode /p:AppxBundle=$env:Appx_Bundle /p:PackageCertificateKeyFile=GitHubActionsWorkflow.pfx /p:PackageCertificatePassword=${{ secrets.Pfx_Key }}
      env:
        Appx_Bundle: Always
        Appx_Bundle_Platforms: x86|x64
        Appx_Package_Build_Mode: StoreUpload
        Configuration: ${{ matrix.configuration }}

    # Remove the pfx
    - name: Remove the pfx
      run: Remove-Item -path $env:Wap_Project_Directory\GitHubActionsWorkflow.pfx

    # Upload the MSIX package: https://github.com/marketplace/actions/upload-a-build-artifact
    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: MSIX Package
        path: ${{ env.Wap_Project_Directory }}\AppPackages
